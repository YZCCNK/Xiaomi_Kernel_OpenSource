name: Generate Kernel Module.symvers

on:
  workflow_dispatch:

jobs:
  generate-symvers:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libssl-dev \
          bc \
          flex \
          bison \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          git \
          wget
        
    - name: Clone Xiaomi kernel source
      run: |
        git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b camellia-r-oss kernel-source
      
    - name: Generate Module.symvers with test module
      run: |
        cd kernel-source
        
        # 设置环境变量
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 清理
        make clean 2>/dev/null || true
        
        # 生成默认配置
        echo "=== 生成 defconfig ==="
        make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE camellia_defconfig
        
        # 确保模块支持已启用
        echo "=== 启用模块支持 ==="
        echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_MODULE_UNLOAD=y" >> .config
        echo "CONFIG_MODULE_FORCE_UNLOAD=y" >> .config
        
        # 更新配置
        make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE olddefconfig
        
        # 创建测试模块目录
        echo "=== 创建测试模块 ==="
        mkdir -p test_module
        
        # 创建 Makefile (使用单引号避免转义问题)
        cat > test_module/Makefile << 'EOF'
obj-m := dummy.o
EOF
        
        # 创建 dummy.c 文件
        cat > test_module/dummy.c << 'EOF'
#include <linux/module.h>
#include <linux/kernel.h>

static int __init dummy_init(void)
{
    return 0;
}

static void __exit dummy_exit(void)
{
}

module_init(dummy_init);
module_exit(dummy_exit);

MODULE_LICENSE("GPL");
EOF
        
        # 编译测试模块 - 这会生成 Module.symvers
        echo "=== 编译测试模块 ==="
        make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE M=test_module modules
        
        # 验证结果
        echo "=== 验证生成结果 ==="
        if [ -f Module.symvers ]; then
            echo "✅ Module.symvers 生成成功！"
            echo "文件大小: $(wc -l < Module.symvers) 行"
            echo "前5行内容:"
            head -5 Module.symvers
        else
            echo "❌ Module.symvers 未生成"
            echo "当前目录内容:"
            ls -la
        fi
        
    - name: Upload Module.symvers
      uses: actions/upload-artifact@v4
      with:
        name: Module.symvers-camellia
        path: kernel-source/Module.symvers


        
