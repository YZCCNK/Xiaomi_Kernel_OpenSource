name: Kernel modules_prepare with Proton Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libncurses5-dev libelf-dev git gcc-aarch64-linux-gnu

      - name: Clone kernel
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b camellia-r-oss kernel
          cd kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang

      - name: Setup environment
        run: |
          cd kernel
          export PATH="$(pwd)/proton-clang/bin:$PATH"
          
          # 设置环境
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export LLVM=1
          
          echo "Compiler info:"
          clang --version
          echo ""
          echo "Linker info:"
          ld.lld --version

      - name: Configure and build
        run: |
          cd kernel
          make camellia_defconfig
          make -j$(nproc) modules_prepare

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: camellia-module-symvers
          path: kernel/Module.symvers
