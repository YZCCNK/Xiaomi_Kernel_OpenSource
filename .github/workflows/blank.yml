name: Build Kernel and Extract Headers
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison libssl-dev libelf-dev bc cpio git make

      - name: Clone Xiaomi Kernel
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b camellia-r-oss
          cd Xiaoma_Kernel_OpenSource

      - name: Configure Kernel (关键步骤)
        run: |
          cd Xiaomi_Kernel_OpenSource
          # 使用小米的默认配置，或从你的设备中提取的config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- camellia_defconfig
          # 如果你有自己设备的.config文件，可以这样导入：
          # cp ../path/to/your_config .config
          # make ARCH=arm64 olddefconfig

      - name: Build Headers
        run: |
          cd Xiaomi_Kernel_OpenSource
          # 这一步会生成所有必要的头文件
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts

      - name: Install Headers
        run: |
          cd Xiaomi_Kernel_OpenSource
          mkdir -p ../kernel-headers
          # 这个命令会整理并安装净化后的头文件
          make ARCH=arm64 INSTALL_HDR_PATH=../kernel-headers headers_install

      - name: Create Headers Archive
        run: |
          tar -czf kernel-headers.tar.gz -C kernel-headers .
          
      - name: Upload Headers as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-headers
          path: kernel-headers.tar.gz
