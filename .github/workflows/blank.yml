- name: Clone camellia-r-oss kernel
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b camellia-r-oss kernel
          cd kernel

      - name: Export cross-compiler & arch
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV

      - name: Download Google Android gcc/clang
        run: |
          # 官方推荐 clang-r416183b（Android-11 gcc 预编译）
          wget -q https://dl.google.com/android/repository/gcc-arm64-linux-android-4.9.tar.gz
          tar -xzf gcc-arm64-linux-android-4.9.tar.gz
          echo "$(pwd)/gcc-arm64-linux-android-4.9/bin" >> $GITHUB_PATH

      - name: Generate defconfig
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- camellia_defconfig

      - name: Prepare modules (生成 Module.symvers)
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- modules_prepare

      - name: Upload Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: Module.symvers-camellia-r-oss
          path: kernel/Module.symvers
