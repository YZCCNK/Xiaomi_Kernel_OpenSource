name: modules_prepare for camellia-r-oss

on:
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git

      - name: Clone kernel
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b camellia-r-oss kernel

      - name: Download toolchains
        run: |
          cd kernel
          # 下载工具链到 kernel 目录
          wget -q https://dl.google.com/android/repository/gcc-arm64-linux-android-4.9.tar.gz
          tar -xzf gcc-arm64-linux-android-4.9.tar.gz
          
          wget -q https://dl.google.com/android/repository/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz
          
          # 清理压缩包
          rm *.tar.gz

      - name: Set environment variables
        run: |
          cd kernel
          # 设置工具链路径
          echo "TOOLCHAIN_PATH=$(pwd)/gcc-arm64-linux-android-4.9/bin" >> $GITHUB_ENV
          echo "CLANG_PATH=$(pwd)/clang-r416183b/bin" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-android-" >> $GITHUB_ENV

      - name: Setup PATH
        run: |
          # 将工具链添加到 PATH
          echo "$CLANG_PATH:$TOOLCHAIN_PATH:$PATH" >> $GITHUB_PATH

      - name: Make defconfig
        run: |
          cd kernel
          make camellia_defconfig

      - name: Run modules_prepare
        run: |
          cd kernel
          make -j$(nproc) modules_prepare

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camellia-module-files
          path: |
            kernel/Module.symvers
            kernel/.config
