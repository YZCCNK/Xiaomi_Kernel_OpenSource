name: Build Kernel Module

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            rsync \
            kmod \
            cpio
          
      - name: Clone camellia-r-oss kernel
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b camellia-r-oss kernel
          
      - name: Setup Android NDK (包含clang和gcc)
        run: |
          # 下载Android NDK r25b，包含clang 14.0.6
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          export NDK_PATH="$(pwd)/android-ndk-r25b"
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
          
      - name: Set environment variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          
      - name: Setup PATH
        run: |
          # 添加NDK工具链到PATH
          echo "${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "${{ env.NDK_PATH }}/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          
      - name: Generate defconfig
        run: |
          cd kernel
          make ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- camellia_defconfig
          
      - name: Prepare modules
        run: |
          cd kernel
          # 使用clang编译
          make ARCH=arm64 \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-android- \
               LLVM=1 \
               LLVM_IAS=1 \
               -j$(nproc) \
               modules_prepare
               
      - name: Upload Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: Module.symvers-camellia-r-oss
          path: kernel/Module.symvers
          
      - name: Upload generated headers (可选)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-headers-camellia
          path: |
            kernel/include/generated/
            kernel/arch/arm64/include/generated/
